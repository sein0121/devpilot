app:
  frontend-url: ${FRONTEND_URL}

github:
  api:
    token: ${GITHUB_PAT}

server:
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 80
      min-spare: 10

spring:
  data:
    redis:
      host: redis
      port: 6379
  session:
    store-type: redis
    timeout: 30m
  datasource:
    url: jdbc:mysql://172.31.40.181:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

ai:
  provider: gemini

gemini:
  api:
    key: ${GEMINI_API_KEY}
    model: gemini-3.6-flash