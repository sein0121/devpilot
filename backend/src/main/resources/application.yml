spring:
  application:
    name: devpilot-backend
  profiles:
    active: local  #시작 시 application-local.yml 자동 로드

server:
  port: 8080

career-analysis:
  lookback-days: 90

resilience4j:
  retry:
    instances:
      github:
        max-attempts: 3
        wait-duration: 500ms
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        ignore-exceptions:
          - com.devpilot.global.exception.GithubApiAuthException
          - com.devpilot.global.exception.GithubApiClientException
      gemini:
        max-attempts: 3
        wait-duration: 1000ms
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - com.devpilot.global.exception.AiRateLimitException

  circuitbreaker:
    instances:
      github:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.devpilot.global.exception.GithubApiAuthException
          - com.devpilot.global.exception.GithubApiClientException
      gemini:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3

  bulkhead:
    instances:
      gemini:
        max-concurrent-calls: 5
        max-wait-duration: 2s