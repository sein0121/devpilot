app:
  frontend-url: http://localhost:5173

github:
  api:
    token: test-pat

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - read:user
              - user:email
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

ai:
  provider: gemini

gemini:
  api:
    key: test-key
    model: gemini-3.6-flash