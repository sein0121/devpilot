global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'devpilot-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9090']

  - job_name: 'devpilot-prod'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['43.202.184.22:9090']

  - job_name: 'devpilot-asg'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['3.37.130.68:9090']